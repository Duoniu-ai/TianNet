<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TIANNET 天网｜系统知识网络</title>
<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden}
body{background:#0d1117;color:#c9d1d9;font-family:"Segoe UI",Arial,"Noto Sans SC","Microsoft YaHei",sans-serif}
#header{position:fixed;top:0;left:0;right:0;z-index:10;display:flex;align-items:center;gap:16px;padding:10px 20px;background:#161b22;border-bottom:1px solid #30363d;box-shadow:0 2px 8px rgba(0,0,0,.2)}
#header h1{font-size:18px;color:#58a6ff;white-space:nowrap}
#search{flex:1;max-width:460px;padding:7px 12px;background:#0d1117;border:1px solid #30363d;border-radius:6px;color:#c9d1d9;outline:none}
#search::placeholder{color:#8b949e}
#search:focus{border-color:#58a6ff;box-shadow:0 0 0 2px rgba(88,166,255,.12)}
#legend{font-size:12px;color:#8b949e;margin-left:auto;white-space:nowrap}
#tree{position:absolute;inset:0;width:100vw;height:100vh;cursor:grab}
#tree:active{cursor:grabbing}
.link{fill:none;stroke:#30363d;stroke-width:1.5px}
.node{cursor:pointer}
.node circle{fill:#161b22;stroke:#58a6ff;stroke-width:2px}
.node.branch circle{fill:#172033;stroke:#a371f7;stroke-width:4px}
.node.project rect{fill:#161b22;stroke:#58a6ff;stroke-width:2.5px}
.node.module circle,.node.tool circle,.node.search circle,.node.database circle,.node.dataset circle,.node.archive circle,.node.platform circle,.node.framework circle,.node.toolkit circle,.node.collection circle,.node.explorer circle,.node.technology circle,.node.reference circle{fill:#238636;stroke:#2ea043}
.node text{font-size:12px;fill:#c9d1d9;dominant-baseline:middle;user-select:none}
.node.branch text{fill:#d2a8ff;font-weight:700;font-size:15px}
.node.project text{fill:#79c0ff;font-weight:700;font-size:14px}
.node.module text{fill:#7ee787}
.node:hover text{fill:#f0f6fc}
.node.match text{fill:#f0b429;font-weight:700}
.node.match circle,.node.match rect{stroke:#f0b429!important}
#tooltip{position:fixed;display:none;z-index:20;pointer-events:none;background:#161b22;border:1px solid #30363d;border-radius:6px;padding:8px 12px;font-size:12px;color:#c9d1d9;max-width:390px;box-shadow:0 8px 20px rgba(0,0,0,.35)}
#tooltip a{color:#58a6ff;word-break:break-all}
#status{position:fixed;left:16px;bottom:14px;z-index:10;padding:6px 9px;background:rgba(22,27,34,.92);border:1px solid #30363d;border-radius:6px;font-size:11px;color:#8b949e}
@media (max-width:900px){#legend{display:none}#header{gap:10px;padding:9px 12px}#header h1{font-size:16px}.node text{font-size:11px}.node.branch text{font-size:13px}.node.project text{font-size:12px}}
</style>
</head>
<body>
<div id="header">
<h1>🕸️ TIANNET 天网</h1>
<input id="search" type="text" placeholder="搜索系统、分支、项目或工具…（回车定位）" autocomplete="off">
<div id="legend">紫圈＝系统分支 · 蓝框＝项目 · 绿点＝模块/资源 · 点击展开/收起 · 滚轮缩放 · 拖拽平移</div>
</div>
<svg id="tree" aria-label="TIANNET 天网系统知识网络"></svg>
<div id="tooltip"></div>
<div id="status">正在加载系统与资源数据…</div>
<script>
(() => {
const svg=d3.select('#tree');
const tooltip=document.getElementById('tooltip');
const status=document.getElementById('status');
const searchInput=document.getElementById('search');
const width=window.innerWidth;
const height=Math.max(320,window.innerHeight-50);
svg.attr('viewBox',`0 0 ${width} ${height}`);
const g=svg.append('g').attr('transform','translate(60,50)');
const zoom=d3.zoom().scaleExtent([0.06,3]).on('zoom',event=>g.attr('transform',event.transform));
svg.call(zoom);
let root;
let nodeId=0;
let matches=[];
let matchQuery='';
let matchIndex=0;
// 横向树：纵向节点间距加大，层级间距显著拉开，避免“分支”和“项目”视觉挤在一起。
const tree=d3.tree().nodeSize([52,340]);
function diagonal(source,target){const mid=(source.y+target.y)/2;return `M${source.y},${source.x}C${mid},${source.x} ${mid},${target.x} ${target.y},${target.x}`;}
function nodeClass(d){return `node ${d.data.type||'category'}${d.data.url?' leaf':''}${matches.includes(d)?' match':''}`;}
function update(source){
 tree(root);
 root.descendants().forEach(d=>{d.y=d.depth*340;});
 const nodes=root.descendants();
 const links=root.links();
 const nodeSelection=g.selectAll('g.node').data(nodes,d=>d.id);
 const nodeEnter=nodeSelection.enter().append('g')
  .attr('class',nodeClass)
  .attr('transform',`translate(${source.y0||0},${source.x0||0})`)
  .on('click',(event,d)=>{
   event.stopPropagation();
   if(d.data.url){window.open(d.data.url,'_blank','noopener,noreferrer');return;}
   if(d.children){d._children=d.children;d.children=null;}
   else if(d._children){d.children=d._children;}
   update(d);
  })
  .on('mousemove',(event,d)=>{
   if(!d.data.url){tooltip.style.display='none';return;}
   tooltip.style.display='block';
   tooltip.style.left=`${Math.min(event.clientX+15,window.innerWidth-410)}px`;
   tooltip.style.top=`${Math.min(event.clientY+15,window.innerHeight-115)}px`;
   tooltip.innerHTML=`<strong>${escapeHtml(d.data.name)}</strong><br><a href="${escapeAttr(d.data.url)}">${escapeHtml(d.data.url)}</a>`;
  })
  .on('mouseleave',()=>{tooltip.style.display='none';});
 nodeEnter.each(function(d){
  const n=d3.select(this);
  if(d.data.type==='project') n.append('rect').attr('x',-10).attr('y',-10).attr('width',20).attr('height',20).attr('rx',4);
  else n.append('circle').attr('r',d.data.type==='branch'?12:(d.data.type==='root'||d.data.type==='system-root'?12:5));
  n.append('text').text(d=>d.data.name);
 });
 const nodeUpdate=nodeEnter.merge(nodeSelection).transition().duration(250)
  .attr('transform',d=>`translate(${d.y},${d.x})`)
  .attr('class',nodeClass);
 nodeUpdate.select('text')
  .attr('x',d=>{
    if(d.data.type==='branch') return -22;
    if(d.data.type==='project') return -22;
    return (d.children||d._children)?-16:14;
  })
  .attr('y',d=>(d.data.type==='branch'||d.data.type==='project')?-20:0)
  .attr('text-anchor',d=>(d.data.type==='branch'||d.data.type==='project'||d.children||d._children)?'end':'start');
 nodeSelection.exit().transition().duration(250).attr('transform',`translate(${source.y},${source.x})`).remove();
 const linkSelection=g.selectAll('path.link').data(links,d=>d.target.id);
 const linkEnter=linkSelection.enter().insert('path','g').attr('class','link').attr('d',()=>{const o={x:source.x0||0,y:source.y0||0};return diagonal(o,o);});
 linkEnter.merge(linkSelection).transition().duration(250).attr('d',d=>diagonal(d.source,d.target));
 linkSelection.exit().transition().duration(250).attr('d',()=>{const o={x:source.x,y:source.y};return diagonal(o,o);}).remove();
 root.descendants().forEach(d=>{d.x0=d.x;d.y0=d.y;});
}
function expandTo(node){let current=node.parent;while(current){if(!current.children&&current._children)current.children=current._children;current=current.parent;}}
function focusNode(node){const scale=1.05;const tx=-node.y*scale+width/3;const ty=-node.x*scale+height/2;svg.transition().duration(500).call(zoom.transform,d3.zoomIdentity.translate(tx,ty).scale(scale));}
function runSearch(){
 const query=searchInput.value.trim().toLowerCase();
 if(!query)return;
 if(query!==matchQuery){matchQuery=query;matches=root.descendants().filter(d=>String(d.data.name||'').toLowerCase().includes(query));matchIndex=0;}
 if(!matches.length){status.textContent=`未找到：${searchInput.value.trim()}`;update(root);return;}
 const target=matches[matchIndex%matches.length];matchIndex+=1;expandTo(target);update(target.parent||root);focusNode(target);status.textContent=`找到 ${matches.length} 项 · 当前第 ${((matchIndex-1)%matches.length)+1} 项`;
}
function escapeHtml(value){return String(value).replace(/[&<>'"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]));}
function escapeAttr(value){return String(value).replace(/&/g,'&amp;').replace(/"/g,'&quot;');}
searchInput.addEventListener('keydown',event=>{if(event.key==='Enter')runSearch();});
svg.on('click',()=>{tooltip.style.display='none';});
Promise.all([d3.json('system.json'),d3.json('arf.json')]).then(([systemData,osintData])=>{
 const osintBranch={name:'OSINT 开源情报资源（OSINT Resources）',type:'branch',children:osintData.children||[]};
 root=d3.hierarchy({name:'天网系统（TIANNET）',type:'root',children:[...(systemData.children||[]),osintBranch]});
 root.x0=height/2;
 root.y0=0;
 root._children=root.children;
 root.descendants().forEach(d=>{d.id=++nodeId;if(d.depth>0){d._children=d.children;d.children=null;}});
 update(root);
 const all=root.descendants();
 const branchCount=all.filter(d=>d.data.type==='branch').length;
 const projectCount=all.filter(d=>d.data.type==='project').length;
 status.textContent=`已加载 · ${all.length} 个节点 · ${branchCount} 个系统分支 · ${projectCount} 个项目`;
}).catch(error=>{console.error(error);status.textContent='加载失败：请确认 system.json 与 arf.json 正常。';});
})();
</script>
</body>
</html>
