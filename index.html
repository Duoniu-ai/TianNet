<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>天网互联（TIANNET）｜OSINT 知识网络</title><script src="https://cdn.jsdelivr.net/npm/d3@7"></script><style>*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden}body{background:#101419;color:#b7bec8;font-family:"Segoe UI",Arial,"Noto Sans SC","Microsoft YaHei",sans-serif}body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.2;background-image:radial-gradient(#66707c .6px,transparent .6px);background-size:24px 24px}#header{position:fixed;z-index:10;top:0;left:0;right:0;height:48px;display:flex;align-items:center;gap:14px;padding:0 18px;background:rgba(18,23,29,.96);border-bottom:1px solid #293039}#header h1{font-size:16px;font-weight:700;color:#d0d5db;white-space:nowrap}#search{width:min(430px,45vw);padding:7px 11px;background:#0f1419;border:1px solid #303740;border-radius:5px;color:#d0d5db;outline:none;font-size:12px}#legend{margin-left:auto;font-size:11px;color:#707985;white-space:nowrap}#tree{position:absolute;inset:0;width:100vw;height:100vh}.link{fill:none;stroke:#46505b;stroke-width:1px;stroke-opacity:.72}.node{cursor:pointer}.node circle{fill:#14191f;stroke:#697481;stroke-width:1.4}.node.root circle{fill:#1d2732;stroke:#aeb9c5;stroke-width:2}.node.category circle{fill:#18283b;stroke:#5d8fbd;stroke-width:1.8}.node.leaf circle{fill:#151a20;stroke:#6b7580}.node text{font-size:12px;fill:#aeb7c1;dominant-baseline:middle;user-select:none}.node.root text{font-size:17px;fill:#e0e5ea;font-weight:700}.node.category text{font-size:13px;fill:#c3ccd5;font-weight:600}.node.leaf text{font-size:12px;fill:#a7b0ba}.node:hover text,.node.match text{fill:#fff}.node.match circle{stroke:#d8e0e8!important;stroke-width:2.2}.count{font-size:9px!important;fill:#65717d!important;pointer-events:none}.hint{font-size:10px!important;fill:#65717d!important}@media(max-width:900px){#legend{display:none}#header h1{font-size:14px}.node.category text{font-size:12px}.node.leaf text{font-size:11px}}@media(max-width:600px){#header{padding:0 10px;gap:8px}#header h1{font-size:13px}#search{width:auto;flex:1}.node text{font-size:10px}.node.category text{font-size:11px}.node.leaf text{font-size:10px}}</style></head><body><div id="header"><h1>天网互联（TIANNET）</h1><input id="search" placeholder="搜索分类、工具或知识节点…（回车定位）"><div id="legend">点击蓝色节点展开/收起 · 点击工具直接打开 · 滚轮缩放 · 拖拽平移</div></div><svg id="tree" aria-label="天网互联（TIANNET）OSINT 知识网络"></svg><script>(()=>{const svg=d3.select('#tree'),g=svg.append('g'),search=document.getElementById('search');let W=innerWidth,H=innerHeight,root,matches=[],query='',mi=0;const zoom=d3.zoom().scaleExtent([.18,4]).on('zoom',e=>g.attr('transform',e.transform));svg.call(zoom).on('dblclick.zoom',null);const tree=d3.tree().nodeSize([34,330]);function resize(){W=innerWidth;H=innerHeight;svg.attr('viewBox',`0 0 ${W} ${H}`)}addEventListener('resize',resize);resize();function assign(n){n.id=n.id||crypto.randomUUID();(n.children||[]).forEach(assign)}function collapse(n){if(!n.children)return;(n.children||[]).forEach(collapse);n._children=n.children;n.children=null}function isLeaf(n){return !n.children&&!n._children}function toggle(n){if(n.children){n._children=n.children;n.children=null;return}if(n._children){n.children=n._children;n._children=null}}function typeOf(d){if(d.depth===0)return'root';return isLeaf(d)?'leaf':'category'}function textOf(d){return d.data.name||''}function nodeClass(d){return`node ${typeOf(d)}${matches.includes(d)?' match':''}`}function linkPath(s,t){const m=(s.y+t.y)/2;return`M${s.y},${s.x}C${m},${s.x} ${m},${t.x} ${t.y},${t.x}`}function draw(duration=180){tree(root);root.each(d=>d.y=d.depth*330);const nodes=root.descendants(),links=root.links();const ns=g.selectAll('g.node').data(nodes,d=>d.id);const enter=ns.enter().append('g').attr('class',nodeClass).on('click',(e,d)=>{e.stopPropagation();if(d.data.url){window.open(d.data.url,'_blank','noopener,noreferrer');return}toggle(d);draw();});enter.append('circle').attr('r',d=>d.depth===0?9:d.depth===1?8:d.children||d._children?7:5);enter.append('text').attr('class','label').text(textOf);enter.append('text').attr('class','count');const merged=enter.merge(ns);merged.attr('class',nodeClass).transition().duration(duration).attr('transform',d=>`translate(${d.y},${d.x})`);merged.select('.label').attr('x',d=>d.children||d._children||d.depth===0||d.depth===1?-18:14).attr('text-anchor',d=>d.children||d._children||d.depth===0||d.depth===1?'end':'start').text(textOf);merged.select('.count').attr('x',d=>d.depth<=1?18:12).attr('y',-11).text(d=>d.children||d._children?(d.children||d._children).length:'');ns.exit().remove();const ls=g.selectAll('path.link').data(links,d=>d.target.id);ls.enter().insert('path','g').attr('class','link').merge(ls).transition().duration(duration).attr('d',d=>linkPath(d.source,d.target));ls.exit().remove()}function centerInitial(){const b=g.node().getBBox();if(!b.width||!b.height)return;const s=Math.min(.95,(W-80)/b.width,(H-100)/b.height);const tx=(W-b.width*s)/2-b.x*s;const ty=64+(H-100-b.height*s)/2-b.y*s;svg.call(zoom.transform,d3.zoomIdentity.translate(tx,ty).scale(s))}function expandPath(n){const chain=[];for(let p=n;p;p=p.parent)chain.push(p);chain.reverse();for(let i=1;i<chain.length;i++){const p=chain[i-1];if(!p.children&&p._children){p.children=p._children;p._children=null}}}function focus(n){const t=d3.zoomTransform(svg.node());const s=Math.max(.7,Math.min(1.5,t.k));const tx=W*.42-n.y*s,ty=H*.5-n.x*s;svg.transition().duration(350).call(zoom.transform,d3.zoomIdentity.translate(tx,ty).scale(s))}function doSearch(){const q=search.value.trim().toLowerCase();if(!q)return;if(q!==query){query=q;matches=root.descendants().filter(d=>textOf(d).toLowerCase().includes(q));mi=0}if(!matches.length)return;const n=matches[mi++%matches.length];expandPath(n);draw(120);requestAnimationFrame(()=>focus(n))}search.addEventListener('keydown',e=>{if(e.key==='Enter')doSearch()});d3.json('arf.json').then(data=>{root=d3.hierarchy(data);assign(root);collapse(root);if(root._children){root.children=root._children;root._children=null}draw(0);requestAnimationFrame(centerInitial)}).catch(err=>{console.error(err);document.title='TianNet 加载失败'})})();</script></body></html>
