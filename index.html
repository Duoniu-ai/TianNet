<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TIANNET 天网｜OSINT 开源情报资源树</title>
<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden}
body{background:#0d1117;color:#c9d1d9;font-family:"Segoe UI",Arial,"Noto Sans SC","Microsoft YaHei",sans-serif}
#header{position:fixed;top:0;left:0;right:0;z-index:10;display:flex;align-items:center;gap:16px;padding:10px 20px;background:#161b22;border-bottom:1px solid #30363d;box-shadow:0 2px 8px rgba(0,0,0,.2)}
#header h1{font-size:18px;color:#58a6ff;white-space:nowrap}
#search{flex:1;max-width:460px;padding:7px 12px;background:#0d1117;border:1px solid #30363d;border-radius:6px;color:#c9d1d9;outline:none}
#search::placeholder{color:#8b949e}
#search:focus{border-color:#58a6ff;box-shadow:0 0 0 2px rgba(88,166,255,.12)}
#legend{font-size:12px;color:#8b949e;margin-left:auto;white-space:nowrap}
#tree{position:absolute;inset:0;width:100vw;height:100vh;cursor:grab}
#tree:active{cursor:grabbing}
.link{fill:none;stroke:#30363d;stroke-width:1.5px}
.node circle{fill:#161b22;stroke:#58a6ff;stroke-width:2px;cursor:pointer}
.node.leaf circle{fill:#238636;stroke:#2ea043}
.node text{font-size:12px;fill:#c9d1d9;cursor:pointer;dominant-baseline:middle;user-select:none}
.node.leaf text{fill:#7ee787}
.node:hover text{fill:#79c0ff}
.node.match text{fill:#f0b429;font-weight:700}
.node.match circle{stroke:#f0b429}
#tooltip{position:fixed;display:none;z-index:20;pointer-events:none;background:#161b22;border:1px solid #30363d;border-radius:6px;padding:8px 12px;font-size:12px;color:#c9d1d9;max-width:390px;box-shadow:0 8px 20px rgba(0,0,0,.35)}
#tooltip a{color:#58a6ff;word-break:break-all}
#status{position:fixed;left:16px;bottom:14px;z-index:10;padding:6px 9px;background:rgba(22,27,34,.92);border:1px solid #30363d;border-radius:6px;font-size:11px;color:#8b949e}
@media (max-width:900px){#legend{display:none}#header{gap:10px;padding:9px 12px}#header h1{font-size:16px}.node text{font-size:11px}}
</style>
</head>
<body>
<div id="header">
<h1>🕸️ TIANNET 天网</h1>
<input id="search" type="text" placeholder="搜索工具或分类…（回车定位）" autocomplete="off">
<div id="legend">绿点＝工具 · 蓝圈＝分类 · 点击展开/收起 · 滚轮缩放 · 拖拽平移</div>
</div>
<svg id="tree" aria-label="天网 OSINT 资源树"></svg>
<div id="tooltip"></div>
<div id="status">正在加载资源数据…</div>
<script>
(() => {
const svg=d3.select('#tree');
const tooltip=document.getElementById('tooltip');
const status=document.getElementById('status');
const searchInput=document.getElementById('search');
const width=window.innerWidth;
const height=Math.max(320,window.innerHeight-50);
svg.attr('viewBox',`0 0 ${width} ${height}`);
const g=svg.append('g').attr('transform','translate(40,50)');
const zoom=d3.zoom().scaleExtent([0.1,3]).on('zoom',event=>g.attr('transform',event.transform));
svg.call(zoom);
let root;
let nodeId=0;
let matches=[];
let matchQuery='';
let matchIndex=0;
const tree=d3.tree().nodeSize([26,210]);
function diagonal(source,target){const mid=(source.y+target.y)/2;return `M${source.y},${source.x}C${mid},${source.x} ${mid},${target.x} ${target.y},${target.x}`;}
function update(source){
 tree(root);
 root.descendants().forEach(d=>{d.y=d.depth*210;});
 const nodes=root.descendants();
 const links=root.links();
 const nodeSelection=g.selectAll('g.node').data(nodes,d=>d.id);
 const nodeEnter=nodeSelection.enter().append('g')
  .attr('class',d=>`node${d.data.url?' leaf':''}`)
  .attr('transform',`translate(${source.y0},${source.x0})`)
  .on('click',(event,d)=>{
   event.stopPropagation();
   if(d.data.url){window.open(d.data.url,'_blank','noopener,noreferrer');return;}
   if(d.children){d._children=d.children;d.children=null;}
   else if(d._children){d.children=d._children;}
   update(d);
  })
  .on('mousemove',(event,d)=>{
   if(!d.data.url){tooltip.style.display='none';return;}
   tooltip.style.display='block';
   tooltip.style.left=`${Math.min(event.clientX+15,window.innerWidth-410)}px`;
   tooltip.style.top=`${Math.min(event.clientY+15,window.innerHeight-115)}px`;
   tooltip.innerHTML=`<strong>${escapeHtml(d.data.name)}</strong><br><a href="${escapeAttr(d.data.url)}">${escapeHtml(d.data.url)}</a>`;
  })
  .on('mouseleave',()=>{tooltip.style.display='none';});
 nodeEnter.append('circle').attr('r',5);
 nodeEnter.append('text').text(d=>d.data.name);
 const nodeUpdate=nodeEnter.merge(nodeSelection).transition().duration(250)
  .attr('transform',d=>`translate(${d.y},${d.x})`)
  .attr('class',d=>`node${d.data.url?' leaf':''}${matches.includes(d)?' match':''}`);
 nodeUpdate.select('circle').attr('r',5);
 nodeUpdate.select('text').attr('x',d=>(d._children||d.children)?-12:12).attr('text-anchor',d=>(d._children||d.children)?'end':'start');
 nodeSelection.exit().transition().duration(250).attr('transform',`translate(${source.y},${source.x})`).remove();
 const linkSelection=g.selectAll('path.link').data(links,d=>d.target.id);
 const linkEnter=linkSelection.enter().insert('path','g').attr('class','link').attr('d',()=>{const o={x:source.x0,y:source.y0};return diagonal(o,o);});
 linkEnter.merge(linkSelection).transition().duration(250).attr('d',d=>diagonal(d.source,d.target));
 linkSelection.exit().transition().duration(250).attr('d',()=>{const o={x:source.x,y:source.y};return diagonal(o,o);}).remove();
 root.descendants().forEach(d=>{d.x0=d.x;d.y0=d.y;});
}
function expandTo(node){let current=node.parent;while(current){if(!current.children&&current._children)current.children=current._children;current=current.parent;}}
function focusNode(node){const scale=1.2;const tx=-node.y*scale+width/3;const ty=-node.x*scale+height/2;svg.transition().duration(500).call(zoom.transform,d3.zoomIdentity.translate(tx,ty).scale(scale));}
function runSearch(){
 const query=searchInput.value.trim().toLowerCase();
 if(!query)return;
 if(query!==matchQuery){matchQuery=query;matches=root.descendants().filter(d=>String(d.data.name||'').toLowerCase().includes(query));matchIndex=0;}
 if(!matches.length){status.textContent=`未找到：${searchInput.value.trim()}`;update(root);return;}
 const target=matches[matchIndex%matches.length];matchIndex+=1;expandTo(target);update(target.parent||root);focusNode(target);status.textContent=`找到 ${matches.length} 项 · 当前第 ${((matchIndex-1)%matches.length)+1} 项`;
}
function escapeHtml(value){return String(value).replace(/[&<>'"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]));}
function escapeAttr(value){return String(value).replace(/&/g,'&amp;').replace(/"/g,'&quot;');}
searchInput.addEventListener('keydown',event=>{if(event.key==='Enter')runSearch();});
svg.on('click',()=>{tooltip.style.display='none';});
d3.json('arf.json').then(data=>{
 root=d3.hierarchy(data);
 root.x0=height/2;
 root.y0=0;
 root._children=root.children;
 root.descendants().forEach(d=>{
  d.id=++nodeId;
  if(d.depth>0){d._children=d.children;d.children=null;}
 });
 update(root);
 status.textContent=`已加载 · ${root.descendants().length} 个节点 · ${root.leaves().length} 个工具`;
}).catch(error=>{console.error(error);status.textContent='加载失败：请确认资源数据文件正常。';});
})();
</script>
</body>
</html>
