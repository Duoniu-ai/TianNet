<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TIANNET 天网｜系统知识网络</title>
<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden}
body{background:#101419;color:#b7bec8;font-family:"Segoe UI",Arial,"Noto Sans SC","Microsoft YaHei",sans-serif}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.28;background-image:radial-gradient(#66707c 0.65px,transparent .65px);background-size:24px 24px}
#header{position:fixed;top:0;left:0;right:0;z-index:10;display:flex;align-items:center;gap:14px;padding:9px 18px;background:rgba(18,23,29,.94);border-bottom:1px solid #293039;box-shadow:0 2px 12px rgba(0,0,0,.16)}
#header h1{font-size:16px;font-weight:600;color:#aeb7c2;white-space:nowrap;letter-spacing:.2px}
#search{flex:1;max-width:430px;padding:7px 11px;background:#0f1419;border:1px solid #303740;border-radius:5px;color:#c2c9d2;outline:none;font-size:12px}
#search::placeholder{color:#68717c}
#search:focus{border-color:#657180;box-shadow:0 0 0 2px rgba(120,132,146,.08)}
#legend{font-size:11px;color:#68717c;margin-left:auto;white-space:nowrap}
#tree{position:absolute;inset:0;width:100vw;height:100vh;cursor:grab}
#tree:active{cursor:grabbing}
.link{fill:none;stroke:#3a424c;stroke-width:1.1px;stroke-opacity:.72}
.node{cursor:pointer}
.node circle{fill:#151a20;stroke:#687482;stroke-width:1.5px}
.node.root circle,.node.system-root circle{fill:#20262d;stroke:#929ba6;stroke-width:2px}
.node.branch circle{fill:#23282f;stroke:#858e99;stroke-width:2px}
.node.project rect{fill:#1a2026;stroke:#697581;stroke-width:1.5px}
.node.module circle,.node.tool circle,.node.search circle,.node.database circle,.node.dataset circle,.node.archive circle,.node.platform circle,.node.framework circle,.node.toolkit circle,.node.collection circle,.node.explorer circle,.node.technology circle,.node.reference circle{fill:#242b31;stroke:#66717d;stroke-width:1px}
.node text{font-size:10px;fill:#9aa3ad;dominant-baseline:middle;user-select:none}
.node.branch text{fill:#b0b7c0;font-weight:600;font-size:12px}
.node.project text{fill:#a8b0ba;font-weight:600;font-size:11px}
.node.module text{fill:#8d97a2}
.node:hover text{fill:#d0d5db}
.node:hover circle,.node:hover rect{stroke:#a4adb7}
.node.match text{fill:#d3d7dc;font-weight:600}
.node.match circle,.node.match rect{stroke:#aeb6bf!important}
.count-badge{font-size:8px;fill:#69737e;dominant-baseline:middle;pointer-events:none}
#tooltip{position:fixed;display:none;z-index:20;pointer-events:none;background:#171c22;border:1px solid #343c45;border-radius:5px;padding:7px 10px;font-size:11px;color:#aeb6c0;max-width:360px;box-shadow:0 8px 20px rgba(0,0,0,.3)}
#tooltip a{color:#8d99a6;word-break:break-all}
#status{position:fixed;left:14px;bottom:12px;z-index:10;padding:5px 8px;background:rgba(20,25,31,.9);border:1px solid #303740;border-radius:5px;font-size:10px;color:#68727d}
@media (max-width:900px){#legend{display:none}#header{gap:9px;padding:8px 11px}#header h1{font-size:14px}.node text{font-size:9px}.node.branch text{font-size:11px}.node.project text{font-size:10px}}
</style>
</head>
<body>
<div id="header">
<h1>TIANNET 天网</h1>
<input id="search" type="text" placeholder="搜索系统、分支、项目或工具…（回车定位）" autocomplete="off">
<div id="legend">分支 · 项目 · 模块/资源 · 点击展开 · 滚轮缩放 · 拖拽平移</div>
</div>
<svg id="tree" aria-label="TIANNET 天网系统知识网络"></svg>
<div id="tooltip"></div>
<div id="status">正在加载系统与资源数据…</div>
<script>
(() => {
const svg=d3.select('#tree'),tooltip=document.getElementById('tooltip'),status=document.getElementById('status'),searchInput=document.getElementById('search');
const width=window.innerWidth,height=Math.max(320,window.innerHeight-50);
svg.attr('viewBox',`0 0 ${width} ${height}`);
const g=svg.append('g').attr('transform','translate(55,55)');
const zoom=d3.zoom().scaleExtent([0.05,3]).on('zoom',e=>g.attr('transform',e.transform));svg.call(zoom);
let root,nodeId=0,matches=[],matchQuery='',matchIndex=0;
const tree=d3.tree().nodeSize([38,300]);
function diagonal(s,t){const mid=(s.y+t.y)/2;return `M${s.y},${s.x}C${mid},${s.x} ${mid},${t.x} ${t.y},${t.x}`;}
function branchDisplayName(name){return String(name||'').replace(/\s*（[^）]*）\s*$/,'').replace(/\s*\([^)]*\)\s*$/,'').trim();}
function displayName(d){return d.depth===1 ? branchDisplayName(d.data.name) : d.data.name;}
function nodeClass(d){return `node ${d.data.type||'category'}${d.data.url?' leaf':''}${matches.includes(d)?' match':''}`;}
function visibleDescendants(){return root.descendants();}
function update(source){
 tree(root);
 root.descendants().forEach(d=>d.y=d.depth*300);
 const nodes=root.descendants(),links=root.links();
 const nodeSelection=g.selectAll('g.node').data(nodes,d=>d.id);
 const nodeEnter=nodeSelection.enter().append('g').attr('class',nodeClass).attr('transform',`translate(${source.y0||0},${source.x0||0})`)
  .on('click',(event,d)=>{event.stopPropagation();if(d.data.url){window.open(d.data.url,'_blank','noopener,noreferrer');return;}if(d.children){d._children=d.children;d.children=null;}else if(d._children){d.children=d._children;}update(d);})
  .on('mousemove',(event,d)=>{if(!d.data.url){tooltip.style.display='none';return;}tooltip.style.display='block';tooltip.style.left=`${Math.min(event.clientX+14,window.innerWidth-380)}px`;tooltip.style.top=`${Math.min(event.clientY+14,window.innerHeight-100)}px`;tooltip.innerHTML=`<strong>${escapeHtml(d.data.name)}</strong><br><a href="${escapeAttr(d.data.url)}">${escapeHtml(d.data.url)}</a>`;})
  .on('mouseleave',()=>tooltip.style.display='none');
 nodeEnter.each(function(d){const n=d3.select(this);if(d.data.type==='project')n.append('rect').attr('x',-7).attr('y',-7).attr('width',14).attr('height',14).attr('rx',3);else n.append('circle').attr('r',d.data.type==='branch'?9:(d.data.type==='root'||d.data.type==='system-root'?9:4));n.append('text').text(displayName(d));if(d.data.children||d.data._children)n.append('text').attr('class','count-badge').text(d=>(d.data.children||d.data._children||[]).length);});
 const nodeUpdate=nodeEnter.merge(nodeSelection).transition().duration(260).attr('transform',d=>`translate(${d.y},${d.x})`).attr('class',nodeClass);
 nodeUpdate.select('text:not(.count-badge)').text(displayName).attr('x',d=>d.data.type==='branch'||d.data.type==='project'?-15:((d.children||d._children)?-12:11)).attr('y',d=>(d.data.type==='branch'||d.data.type==='project')?-16:0).attr('text-anchor',d=>(d.data.type==='branch'||d.data.type==='project'||d.children||d._children)?'end':'start');
 nodeUpdate.select('.count-badge').attr('x',d=>d.data.type==='branch'||d.data.type==='project'?14:9).attr('y',-1);
 nodeSelection.exit().transition().duration(220).attr('transform',`translate(${source.y},${source.x})`).remove();
 const linkSelection=g.selectAll('path.link').data(links,d=>d.target.id);
 const linkEnter=linkSelection.enter().insert('path','g').attr('class','link').attr('d',()=>{const o={x:source.x0||0,y:source.y0||0};return diagonal(o,o);});
 linkEnter.merge(linkSelection).transition().duration(260).attr('d',d=>diagonal(d.source,d.target));
 linkSelection.exit().transition().duration(220).attr('d',()=>{const o={x:source.x,y:source.y};return diagonal(o,o);}).remove();
 root.descendants().forEach(d=>{d.x0=d.x;d.y0=d.y;});
}
function expandTo(node){let p=node.parent;while(p){if(!p.children&&p._children)p.children=p._children;p=p.parent;}}
function focusNode(node){const scale=1;const tx=-node.y*scale+width/3,ty=-node.x*scale+height/2;svg.transition().duration(450).call(zoom.transform,d3.zoomIdentity.translate(tx,ty).scale(scale));}
function runSearch(){const q=searchInput.value.trim().toLowerCase();if(!q)return;if(q!==matchQuery){matchQuery=q;matches=root.descendants().filter(d=>String(d.data.name||'').toLowerCase().includes(q)||displayName(d).toLowerCase().includes(q));matchIndex=0;}if(!matches.length){status.textContent=`未找到：${searchInput.value.trim()}`;update(root);return;}const target=matches[matchIndex%matches.length];matchIndex++;expandTo(target);update(target.parent||root);focusNode(target);status.textContent=`找到 ${matches.length} 项 · 当前第 ${((matchIndex-1)%matches.length)+1} 项`;}
function escapeHtml(v){return String(v).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
function escapeAttr(v){return String(v).replace(/&/g,'&amp;').replace(/"/g,'&quot;');}
searchInput.addEventListener('keydown',e=>{if(e.key==='Enter')runSearch();});svg.on('click',()=>tooltip.style.display='none');
Promise.all([d3.json('system.json'),d3.json('arf.json')]).then(([systemData,osintData])=>{
 const osintBranch={name:'OSINT 开源情报资源（OSINT Resources）',type:'branch',children:osintData.children||[]};
 root=d3.hierarchy({name:'天网系统（TIANNET）',type:'root',children:[...(systemData.children||[]),osintBranch]});root.x0=height/2;root.y0=0;root._children=root.children;
 root.descendants().forEach(d=>{d.id=++nodeId;if(d.depth>0){d._children=d.children;d.children=null;}});
 update(root);const all=visibleDescendants();status.textContent=`已加载 · ${all.length} 个节点 · ${all.filter(d=>d.data.type==='branch').length} 个分支 · ${all.filter(d=>d.data.type==='project').length} 个项目`;
}).catch(e=>{console.error(e);status.textContent='加载失败：请确认 system.json 与 arf.json 正常。';});
})();
</script>
</body>
</html>
