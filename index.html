<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>天网互联（TIANNET）｜系统知识网络</title><script src="https://cdn.jsdelivr.net/npm/d3@7"></script><style>*{box-sizing:border-box;margin:0}html,body{width:100%;height:100%;overflow:hidden}body{background:#101419;color:#b7bec8;font-family:"Segoe UI",Arial,"Noto Sans SC","Microsoft YaHei",sans-serif}body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.28;background-image:radial-gradient(#66707c .65px,transparent .65px);background-size:24px 24px}#header{position:fixed;top:0;left:0;right:0;z-index:10;display:flex;align-items:center;gap:14px;padding:9px 18px;background:rgba(18,23,29,.94);border-bottom:1px solid #293039}#header h1{font-size:16px;font-weight:600;color:#aeb7c2;white-space:nowrap}#search{flex:1;max-width:430px;padding:7px 11px;background:#0f1419;border:1px solid #303740;border-radius:5px;color:#c2c9d2;outline:none;font-size:12px}#legend{font-size:11px;color:#68717c;margin-left:auto;white-space:nowrap}#tree{position:absolute;inset:0;width:100vw;height:100vh;cursor:grab}.link{fill:none;stroke:#3a424c;stroke-width:1.1px;stroke-opacity:.72}.node{cursor:pointer}.node circle{fill:#151a20;stroke:#687482;stroke-width:1.5px}.node.branch circle{fill:#23282f;stroke:#858e99;stroke-width:2px}.node text{font-size:10px;fill:#9aa3ad;dominant-baseline:middle;user-select:none}.node.root text{font-size:14px;fill:#d0d5db;font-weight:700}.node.branch text{fill:#b0b7c0;font-weight:600;font-size:12px}.node:hover text,.node.match text{fill:#d0d5db}.node.match circle{stroke:#aeb6bf!important}.count-badge{font-size:8px;fill:#69737e;pointer-events:none}@media(max-width:900px){#legend{display:none}#header h1{font-size:14px}.node text{font-size:9px}.node.branch text{font-size:11px}}</style></head><body><div id="header"><h1>天网互联（TIANNET）</h1><input id="search" placeholder="搜索系统、分支、项目或知识节点…（回车定位）"><div id="legend">分支 · 模块/资源 · 点击展开 · 滚轮缩放 · 拖拽平移</div></div><svg id="tree" aria-label="天网互联（TIANNET）系统知识网络"></svg><div id="status">正在加载系统数据…</div><script>(()=>{const svg=d3.select('#tree'),g=svg.append('g'),status=document.getElementById('status'),search=document.getElementById('search');const W=innerWidth,H=innerHeight;svg.attr('viewBox',`0 0 ${W} ${H}`);const zoom=d3.zoom().scaleExtent([.05,3]).on('zoom',e=>g.attr('transform',e.transform));svg.call(zoom);const tree=d3.tree().nodeSize([24,300]);let root,id=0,matches=[],query='',mi=0;function name(d){return d.depth===1?String(d.data.name).replace(/\s*（[^）]*）$/,'').replace(/\s*\([^)]*\)$/,'').trim():d.data.name}function path(s,t){const m=(s.y+t.y)/2;return`M${s.y},${s.x}C${m},${s.x} ${m},${t.x} ${t.y},${t.x}`}function draw(){tree(root);root.descendants().forEach(d=>d.y=d.depth*300);const ns=root.descendants(),ls=root.links();const sel=g.selectAll('g.node').data(ns,d=>d.id);const en=sel.enter().append('g').attr('class',d=>`node ${d.data.type||'module'}${matches.includes(d)?' match':''}`).on('click',(e,d)=>{e.stopPropagation();if(d.children){d._children=d.children;d.children=null}else if(d._children){d.children=d._children}draw()});en.each(function(d){const n=d3.select(this);n.append('circle').attr('r',d.data.type==='branch'||d.data.type==='system-root'?9:4);n.append('text').attr('class','node-label').text(name(d));if(d.data.children||d.data._children)n.append('text').attr('class','count-badge').text((d.data.children||d.data._children||[]).length)});const up=en.merge(sel).transition().duration(220).attr('transform',d=>`translate(${d.y},${d.x})`).attr('class',d=>`node ${d.data.type||'module'}${matches.includes(d)?' match':''}`);up.select('.node-label').attr('x',d=>d.data.type==='branch'||d.data.type==='system-root'||d.children||d._children?-15:11).attr('text-anchor',d=>d.data.type==='branch'||d.data.type==='system-root'||d.children||d._children?'end':'start').text(name);up.select('.count-badge').attr('x',d=>d.data.type==='branch'?24:15);sel.exit().remove();const lp=g.selectAll('path.link').data(ls,d=>d.target.id);lp.enter().insert('path','g').attr('class','link').merge(lp).transition().duration(220).attr('d',d=>path(d.source,d.target));lp.exit().remove();root.descendants().forEach(d=>{d.x0=d.x;d.y0=d.y})}function centerTree(){const node=g.node();if(!node)return;const b=node.getBBox();if(!b.width||!b.height)return;const padX=44,padY=82;const availableW=Math.max(240,W-padX*2),availableH=Math.max(180,H-padY);const scale=Math.min(1,availableW/b.width,availableH/b.height);const tx=(W-b.width*scale)/2-b.x*scale;const ty=((H+32)-b.height*scale)/2-b.y*scale;svg.transition().duration(450).call(zoom.transform,d3.zoomIdentity.translate(tx,ty).scale(scale))}function expand(n){for(let p=n.parent;p;p=p.parent)if(!p.children&&p._children)p.children=p._children}function focus(n){svg.transition().duration(400).call(zoom.transform,d3.zoomIdentity.translate(W/2-n.y,H/2-n.x))}function doSearch(){const q=search.value.trim().toLowerCase();if(!q)return;if(q!==query){query=q;matches=root.descendants().filter(d=>String(d.data.name||'').toLowerCase().includes(q)||name(d).toLowerCase().includes(q));mi=0}if(!matches.length){status.textContent=`未找到：${search.value.trim()}`;draw();return}const n=matches[mi++%matches.length];expand(n);draw();focus(n);status.textContent=`找到 ${matches.length} 项 · 当前第 ${((mi-1)%matches.length)+1} 项`}search.addEventListener('keydown',e=>{if(e.key==='Enter')doSearch()});d3.json('system.json').then(system=>{root=d3.hierarchy(system);root.id=++id;root.x0=H/2;root.y0=0;root.children&&root.children.forEach(d=>{d.id=++id;d._children=d.children;d.children=null});draw();const all=root.descendants();status.textContent=`已加载 · ${all.length} 个节点 · ${root.children?root.children.length:0} 个一级分支`;requestAnimationFrame(centerTree)}).catch(e=>{console.error(e);status.textContent='加载失败：请确认 system.json 正常。'})})();</script></body></html>
