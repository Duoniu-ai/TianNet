<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>天网互联（TIANNET）｜系统知识网络</title><script src="https://cdn.jsdelivr.net/npm/d3@7"></script><style>*{box-sizing:border-box;margin:0}html,body{width:100%;height:100%;overflow:hidden}body{background:#101419;color:#b7bec8;font-family:"Segoe UI",Arial,"Noto Sans SC","Microsoft YaHei",sans-serif}body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.22;background-image:radial-gradient(#66707c .6px,transparent .6px);background-size:24px 24px}#header{position:fixed;top:0;left:0;right:0;z-index:10;display:flex;align-items:center;gap:14px;padding:9px 18px;background:rgba(18,23,29,.94);border-bottom:1px solid #293039}#header h1{font-size:16px;font-weight:600;color:#aeb7c2;white-space:nowrap}#search{flex:1;max-width:430px;padding:7px 11px;background:#0f1419;border:1px solid #303740;border-radius:5px;color:#c2c9d2;outline:none;font-size:12px}#legend{font-size:11px;color:#68717c;margin-left:auto;white-space:nowrap}#tree{position:absolute;inset:0;width:100vw;height:100vh;cursor:grab}.link{fill:none;stroke:#46505b;stroke-width:1px;stroke-opacity:.72}.node{cursor:pointer}.node circle{fill:#151a20;stroke:#687482;stroke-width:1.4px}.node.branch circle{fill:#23282f;stroke:#858e99;stroke-width:1.8px}.node text{font-size:10px;fill:#9aa3ad;dominant-baseline:middle;user-select:none}.node.system-root text{font-size:14px;fill:#d0d5db;font-weight:700}.node.branch text,.node.level2 text,.node.project text{fill:#b0b7c0;font-weight:600;font-size:12px}.node:hover text,.node.match text{fill:#d0d5db}.node.match circle{stroke:#aeb6bf!important}.count-badge{font-size:8px;fill:#69737e;pointer-events:none}@media(max-width:900px){#legend{display:none}#header h1{font-size:14px}.node text{font-size:10px}.node.branch text,.node.level2 text,.node.project text{font-size:11px}}@media(max-width:600px){#header{gap:8px;padding:8px 10px}#header h1{font-size:13px}#search{max-width:none}.node text{font-size:9px}.node.branch text,.node.level2 text,.node.project text{font-size:10px}}</style></head><body><div id="header"><h1>天网互联（TIANNET）</h1><input id="search" placeholder="搜索系统、分支、项目或知识节点…（回车定位）"><div id="legend">点击节点逐层展开 · 再次点击收起 · 滚轮缩放 · 拖拽平移</div></div><svg id="tree" aria-label="天网互联（TIANNET）系统知识网络"></svg><div id="status">正在加载系统数据…</div><script>(()=>{const svg=d3.select('#tree'),g=svg.append('g'),status=document.getElementById('status'),search=document.getElementById('search');let W=innerWidth,H=innerHeight;const zoom=d3.zoom().scaleExtent([.15,3]).on('zoom',e=>g.attr('transform',e.transform));svg.call(zoom);const tree=d3.tree().nodeSize([30,280]);let root,id=0,matches=[],query='',mi=0;function resize(){W=innerWidth;H=innerHeight;svg.attr('viewBox',`0 0 ${W} ${H}`);fitVisible(false)}addEventListener('resize',resize);function label(d){return d.depth===1?String(d.data.name||'').replace(/^\d+\s*[·.]?\s*/,'').trim():d.data.name||''}function path(s,t){const m=(s.y+t.y)/2;return`M${s.y},${s.x}C${m},${s.x} ${m},${t.x} ${t.y},${t.x}`}function assign(n){n.id=++id;(n.children||[]).forEach(assign)}function collapseDeep(n){if(!n.children)return;(n.children||[]).forEach(collapseDeep);n._children=n.children;n.children=null}function collapseOne(n){if(n.depth===0)return;if(n.children){n._children=n.children;n.children=null}else if(n._children){n.children=n._children;n.children.forEach(c=>{if(c.children){c._children=c.children;c.children=null}})}}function nodeClass(d){const level=d.depth===1?'branch':d.depth===2?'level2':(d.data.type||'module');return`node ${level}${matches.includes(d)?' match':''}`}function draw(duration=220){tree(root);root.each(d=>{d.y=d.depth*280});const ns=root.descendants(),ls=root.links();const sel=g.selectAll('g.node').data(ns,d=>d.id);const en=sel.enter().append('g').attr('class',nodeClass).on('click',(e,d)=>{e.stopPropagation();collapseOne(d);draw();requestAnimationFrame(()=>fitVisible(true))});en.each(function(d){const n=d3.select(this);n.append('circle').attr('r',d.depth<=1?8:d.depth===2?6:4);n.append('text').attr('class','node-label').text(label(d));if(d.data.children||d.data._children)n.append('text').attr('class','count-badge').text((d.data.children||d.data._children||[]).length)});const up=en.merge(sel).transition().duration(duration).attr('transform',d=>`translate(${d.y},${d.x})`).attr('class',nodeClass);up.select('.node-label').attr('x',d=>d.children||d._children||d.depth<=2?-16:12).attr('text-anchor',d=>d.children||d._children||d.depth<=2?'end':'start').text(label);up.select('.count-badge').attr('x',d=>d.depth<=2?24:14);sel.exit().remove();const lp=g.selectAll('path.link').data(ls,d=>d.target.id);lp.enter().insert('path','g').attr('class','link').merge(lp).transition().duration(duration).attr('d',d=>path(d.source,d.target));lp.exit().remove()}function fitVisible(animated=true){const el=g.node();if(!el)return;const b=el.getBBox();if(!b.width||!b.height)return;const padX=58,padTop=78,padBottom=30;const availW=Math.max(260,W-padX*2),availH=Math.max(180,H-padTop-padBottom);const scale=Math.min(1,availW/b.width,availH/b.height);const tx=(W-b.width*scale)/2-b.x*scale;const ty=padTop+(availH-b.height*scale)/2-b.y*scale;const t=d3.zoomIdentity.translate(tx,ty).scale(scale);(animated?svg.transition().duration(350):svg).call(zoom.transform,t)}function expandPath(n){const chain=[];for(let p=n;p;p=p.parent)chain.push(p);chain.reverse();chain.forEach((p,i)=>{if(i===0)return;if(!p.parent.children&&p.parent._children)p.parent.children=p.parent._children})}function focus(n){const scale=.92;const tx=W*.42-n.y*scale;const ty=H*.5-n.x*scale;svg.transition().duration(380).call(zoom.transform,d3.zoomIdentity.translate(tx,ty).scale(scale))}function doSearch(){const q=search.value.trim().toLowerCase();if(!q)return;if(q!==query){query=q;matches=root.descendants().filter(d=>String(d.data.name||'').toLowerCase().includes(q)||label(d).toLowerCase().includes(q));mi=0}if(!matches.length){status.textContent=`未找到：${search.value.trim()}`;draw();return}const n=matches[mi++%matches.length];expandPath(n);draw();requestAnimationFrame(()=>focus(n));status.textContent=`找到 ${matches.length} 项 · 当前第 ${((mi-1)%matches.length)+1} 项`}search.addEventListener('keydown',e=>{if(e.key==='Enter')doSearch()});d3.json('system.json').then(system=>{root=d3.hierarchy(system);assign(root);collapseDeep(root);if(root._children){root.children=root._children;root._children=null}draw(0);status.textContent=`已加载 · ${root.descendants().length} 个节点 · ${root.children.length} 个一级分支`;requestAnimationFrame(()=>fitVisible(false))}).catch(e=>{console.error(e);status.textContent='加载失败：请确认 system.json 正常。'})})();</script></body></html>
